[project]
name = "warden-mcp"
version = "0.1.0"
description = "MCP server for the Warden engine control-plane API."
readme = "README.md"
authors = [{ name = "The Warden Authors" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.0",
    "httpx>=0.28",
    "pydantic-settings>=2.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "pytest-httpx>=0.36",
    "pytest-mock>=3.15",
    "ruff>=0.8",
]

[project.scripts]
warden-mcp = "warden_mcp.__main__:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "warden_mcp"
module-root = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
