# Mock MCP demo saga — compose greet then summarize from catalog steps.
# Requires: worker.mock-mcp.yaml, step.mock-greet.yaml, step.mock-summarize.yaml
kind: saga
name: mock-mcp-saga
namespace: default
version: "0.1.0"
description: Greet by name via mock LLM and echo MCP; summarize the greeting in a second step.
steps:
  - id: greet
    use: mock-greet
    version: "0.1.0"
    with:
      name:
        from: $.input.name

  - id: summarize
    use: mock-summarize
    version: "0.1.0"
    with:
      greeting:
        from: $.steps.greet.output.data.greeting
