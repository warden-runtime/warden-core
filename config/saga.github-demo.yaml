# GitHub MCP demo saga — compose triage then governed comment from catalog steps.
# Requires: worker.github-demo.yaml, step.github-triage.yaml, step.github-post-comment.yaml,
# prompts/policies/schemas roots, GITHUB_PERSONAL_ACCESS_TOKEN.
kind: saga
name: github-demo
namespace: default
version: "0.1.0"
description: Triage open issues (reason + GitHub MCP); post a governed comment when there is work, or complete cleanly when the repo has no open issues.
steps:
  - id: triage
    use: github-triage
    version: "0.1.0"
    with:
      owner:
        from: $.input.owner
      repo:
        from: $.input.repo
      focus_issue_number:
        from: $.input.issue_number

  - id: post-comment
    use: github-post-comment
    version: "0.1.0"
    when:
      cel: "has(steps.triage.facts.triage_metrics) && steps.triage.facts.triage_metrics.total_count > 0"
    with:
      owner:
        from: $.input.owner
      repo:
        from: $.input.repo
      issue_number:
        from: $.steps.triage.output.data.recommended_issue_number
      body:
        from: $.steps.triage.output.data.comment_body
